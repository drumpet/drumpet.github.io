title: Anthony Paek
description: Co-founder and Executive Chairman of Lunit. Ph.D in Electrical Engineering, KAIST.
url: https://anthonypaek.com
permalink: /blog/:title/
markdown: kramdown
timezone: Asia/Seoul
# Cloudflare Worker that counts page views (analytics/README.md, stats at /manage/). Empty = no tracking.
analytics_url: ""

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - docs
  - scripts
  - analytics
  - write/test.mjs
  - manage/test.mjs
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
