<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Manage · Anthony Paek</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/manage/manage.css">
</head>
<body>
  <header class="bar">
    <strong>방문 통계</strong>
    <select id="days" title="기간">
      <option value="7">최근 7일</option>
      <option value="30" selected>최근 30일</option>
      <option value="90">최근 90일</option>
      <option value="365">최근 1년</option>
    </select>
    <button id="btn-refresh" type="button">새로고침</button>
    <span id="status" class="status"></span>
    <span class="spacer"></span>
    <a class="muted" href="/write/">글쓰기 →</a>
    <button id="btn-settings" type="button">설정</button>
  </header>

  <main id="stats-body" class="page"></main>

  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>설정</h2>
      <p class="hint">이 브라우저의 localStorage에만 저장됩니다. 값은 <code>analytics/README.md</code>의 배포 과정에서 정합니다.</p>
      <label>Worker URL <input name="url" autocomplete="off" placeholder="https://ap-pulse.<계정>.workers.dev"></label>
      <label>통계 토큰 <input type="password" name="token" autocomplete="off"></label>
      <menu>
        <button type="button" id="btn-settings-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="/manage/manage.js"></script>
</body>
</html>
